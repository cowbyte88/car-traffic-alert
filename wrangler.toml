name = "car-traffic-alert"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Destinos: nomes/endereços em texto livre, geocodificados em runtime pela TomTom.
# Não são dados sensíveis, então ficam aqui (versionados no repo).
[vars]
DEST_BOCA = "RMBJJ Academy, Delray Beach, FL"
DEST_PBG = "LifeTime, Palm Beach Gardens, FL"

# Secrets (NÃO ficam neste arquivo — configure com `wrangler secret put <NOME>`):
#   TOMTOM_API_KEY  - sua API key da TomTom
#   AUTH_TOKEN      - token que só você conhece, exigido como ?key= na URL do worker
#   HOME_ADDRESS    - endereço da sua casa (usado só para geocoding, nunca commitado)
#   NTFY_TOPIC      - o "tópico" secreto do ntfy.sh onde a notificação é publicada
